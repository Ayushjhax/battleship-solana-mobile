# Render Blueprint for the match server. If you connect the repo and choose
# "New Blueprint Instance", Render reads this file and fills in every field
# below automatically. If you instead choose "New Web Service" and configure
# it by hand in the dashboard, use these same values (see README.md's
# "Deploying the match server" section for the field-by-field walkthrough).
#
# Match state (rooms, matchmaking queues) lives in process memory, so this must
# run as exactly ONE instance. Never enable autoscaling or add a second one: a
# second process cannot see the first one's rooms, so matches would randomly
# land on a server that has never heard of them.
#
# This is set to the free plan deliberately, with eyes open. Free instances
# suspend after ~15 minutes without inbound traffic, and that has two costs:
#
#   1. Any match in progress when it suspends is gone. The clients see the
#      socket close and their reconnect fails; the 45-second grace expires and
#      the match is forfeited. Nothing is corrupted — settlement is atomic and
#      wagers are held in Postgres, not in memory — but the game is over.
#   2. The first request after a suspension waits for a container cold start,
#      tens of seconds. The app handles this rather than hanging: it pings
#      /health until the server answers (src/net/wake.ts) and holds onboarding
#      behind a loader until the account handoff lands.
#
# Move to `starter` for anything with real players: it stays always-on, which
# removes both costs above without another change anywhere.
services:
  - type: web
    name: seabattle-match-server
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_JWT_VERIFICATION_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: TREASURY_PUBLIC_KEY
        sync: false
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: SELL_POINTS_COST
        value: "100"
      - key: SELL_SOL_PAYOUT
        value: "0.001"
