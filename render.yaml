# Render Blueprint for the match server. If you connect the repo and choose
# "New Blueprint Instance", Render reads this file and fills in every field
# below automatically. If you instead choose "New Web Service" and configure
# it by hand in the dashboard, use these same values (see README.md's
# "Deploying the match server" section for the field-by-field walkthrough).
#
# Match state (rooms, matchmaking queues) lives in process memory, so this
# must run as exactly one always-on instance:
#   - plan must NOT be "free" — Render's free web services spin down after
#     15 minutes idle, which would silently drop every in-progress match.
#   - do not enable autoscaling / add a second instance. A second process
#     can't see the first one's rooms, so matches would randomly 50/50 land
#     on a server that's never heard of them.
services:
  - type: web
    name: seabattle-match-server
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_JWT_VERIFICATION_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: TREASURY_PUBLIC_KEY
        sync: false
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: SELL_POINTS_COST
        value: "100"
      - key: SELL_SOL_PAYOUT
        value: "0.001"
